name: Full browser smoke test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright and browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile interaction
        run: node tests/browser-smoke.cjs
      - name: Publish browser artifacts with safe retry
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/unseen-ci-artifacts
          for f in reports/verification.json assets/site-preview-desktop.jpg assets/site-preview-mobile.jpg; do
            if test -f "$f"; then
              cp "$f" "/tmp/unseen-ci-artifacts/$(basename "$f")"
            fi
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports assets
            if test -f /tmp/unseen-ci-artifacts/verification.json; then cp /tmp/unseen-ci-artifacts/verification.json reports/; fi
            for f in site-preview-desktop.jpg site-preview-mobile.jpg; do
              if test -f "/tmp/unseen-ci-artifacts/$f"; then cp "/tmp/unseen-ci-artifacts/$f" assets/; fi
            done
            git add -f reports/verification.json assets/site-preview-desktop.jpg assets/site-preview-mobile.jpg 2>/dev/null || true
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Vol III desktop/mobile immersion browser checks"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent push. Retry $attempt/5..."
            sleep 3
          done
          echo "Could not publish the report after 5 attempts"
          exit 1
