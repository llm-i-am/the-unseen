name: Full browser smoke test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright and browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile interaction
        run: node tests/browser-smoke.cjs
      - name: Commit screenshots and verification report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/verification.json assets/site-preview-desktop.jpg assets/site-preview-mobile.jpg 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record desktop/mobile visual smoke checks"
            git push
          fi
