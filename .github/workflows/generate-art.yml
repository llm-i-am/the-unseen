name: Generate social preview and bookmark images
on:
  push:
    branches: [main]
    paths:
      - 'assets/artwork/**'
      - '.github/workflows/generate-art.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderers
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Build previews and icon set
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import cairosvg
          from PIL import Image
          folder=Path('assets')
          folder.mkdir(exist_ok=True)
          def png(input, out, size):
              data=cairosvg.svg2png(url=str(input),output_width=size[0],output_height=size[1])
              (folder/out).write_bytes(data)
              return Image.open(BytesIO(data)).convert('RGBA')
          source=Path('assets/artwork')
          png(source/'share.svg','og-cover.png',(1200,630))
          png(source/'share-alt.svg','og-alternative.png',(1200,630))
          icon=source/'symbol.svg'
          for size,file in [(16,'favicon-16.png'),(32,'favicon-32.png'),(180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png')]:
              png(icon,file,(size,size))
          sizes=[(16,16),(32,32),(48,48)]
          png(icon,'favicon-48.png',(48,48)).save('favicon.ico',format='ICO',sizes=sizes)
          print('Generated',*(str(p) for p in folder.glob('*.png')),sep='\n')
          PY
      - name: Commit generated PNG/ICO artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.png favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m "Generate PNG and favicon assets for iOS, web and sharing"
            git push
          fi
